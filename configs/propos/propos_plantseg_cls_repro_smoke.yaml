experiment:
  name: propos_cls_repro_smoke
  seed: 42  # Override with --seed; other comparison seeds: 67, 69.
  output_dir: outputs/reproducibility_smoke/live
dataset:
  name: plantseg
  manifest: data/manifests/plantseg.json
  limit_per_class: 3
  include_classes:
  - apple_black_rot
  - apple_mosaic_virus
  training_views: auto
backbone:
  family: dinov2
  variant: facebook/dinov2-small
  revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
  freeze: true
  image_size: 224
gloca:
  enabled: false
  name: disabled
  embedding_dim: 384
  normalize_output: true
head:
  name: propos
  n_clusters: auto
  training_mode: contrastive_two_view
propos:
  embedding_dim: 384
  projection_dim: 8
  projection_hidden_dim: 8
  predictor_hidden_dim: 8
  temperature: 0.5
  sigma: 0.001
  lambda_psl: 0.1
  ema_momentum: 0.996
  ema_momentum_max: 1.0
  ema_momentum_increase: true
  kmeans_interval: 1
  kmeans_init: kmeans++
  kmeans_n_init: 1
  kmeans_max_iter: 4
  kmeans_tol: 0.0001
  warmup_epochs: 0
  predictor_lr_multiplier: 10.0
  weight_decay: 0.0001
  optimizer: adamw
  symmetric_loss: true
  profile_batches: false
  gloca_lr_multiplier: 1.0
  gloca_alpha_lr_multiplier: 1.0
  freeze_gloca: false
  freeze_gloca_epochs: 0
  log_gloca_diagnostics: false
prediction:
  deterministic: true
  export_embeddings: true
  export_attention: true
trainer:
  deterministic: true
  max_epochs: 1
  batch_size: 6
  lr: 0.0005
  accelerator: auto
  precision: 32
  matmul_precision: high
  num_workers: 0
  checkpoint_interval: 1
  eval_interval: checkpoint
  resume_from_checkpoint: null
  profile_resources: true
