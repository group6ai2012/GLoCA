experiment:
  name: cdc_gloca_gated_repro_smoke
  seed: 42  # Override with --seed; other comparison seeds: 67, 69.
  output_dir: outputs/reproducibility_smoke/live
dataset:
  name: plantseg
  manifest: data/manifests/plantseg.json
  limit_per_class: 3
  include_classes:
  - apple_black_rot
  - apple_mosaic_virus
  training_views: cdc_weak_strong_calibration
backbone:
  family: dinov2
  variant: facebook/dinov2-small
  revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
  freeze: true
  image_size: 224
gloca:
  enabled: true
  name: gloca_gated
  embedding_dim: 384
  alpha_init: 0.0
  normalize_output: true
  attention_hidden_dim: 384
  mlp_hidden_dim: 768
head:
  name: cdc
  n_clusters: auto
  training_mode: cdc
cdc:
  embedding_dim: 384
  hidden_dim: 8
  training_views: cdc_weak_strong_calibration
  meta_batch_size: 6
  sub_batch_size: 3
  per_class_selected_num: auto
  calibration_k: 2
  meta_batch_drop_last: false
  w_en: 1.0
  prototype_init: true
  orthogonalize_init: false
  kmeans_init: kmeans++
  kmeans_n_init: 1
  kmeans_max_iter: 4
  kmeans_tol: 0.0001
  weight_decay: 0.0
  optimizer: adamw
  gloca_lr_multiplier: 1.0
  gloca_alpha_lr_multiplier: 1.0
  freeze_gloca: false
  freeze_gloca_epochs: 0
  log_gloca_diagnostics: true
  progress: true
  augment:
    weak:
      name: current_train
    strong:
      name: randaugment_cutout
      randaugment_n: 4
      cutout_enabled: true
      cutout_n_holes: 1
      cutout_length: 56
    calibration:
      name: deterministic_prediction
prediction:
  deterministic: true
  export_embeddings: true
  export_attention: true
trainer:
  deterministic: true
  max_epochs: 1
  batch_size: 6
  lr: 0.0001
  accelerator: auto
  precision: 32
  matmul_precision: high
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  checkpoint_interval: 1
  eval_interval: checkpoint
  resume_from_checkpoint: null
  profile_resources: true
